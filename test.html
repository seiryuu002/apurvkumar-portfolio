<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Secret page</title>
    </head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    
        body {
            min-height: 100vh;
            background: #d685ba;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    
        .container {
            text-align: center;
            padding: 2rem;
        }
    
        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 20px;
            font-weight: 500;
            color: #e0e0e0;
            letter-spacing: 1px;
        }
    
        h1 {
            font-size: 28px;
            font-weight: 500;
            color: #f0f0f0;
            margin-bottom: 0.4rem;
            letter-spacing: -0.5px;
        }
    
        .domain {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            font-family: monospace;
            letter-spacing: 0.5px;
            margin-bottom: 1.5rem;
        }
    
        .divider {
            width: 32px;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
            margin: 0 auto 1.5rem;
        }
    
        .tagline {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
    
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
    
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
        }
    </style>
    <body>
        <div class="container">
            <div class="avatar">GS</div>
            <h1>Shailiiiii</h1>
            <p class="domain">apurvkumar.me/shaili</p>
            <div class="divider"></div>
            <p class="tagline">This page exists solely for Shailiiiii.</p>
            <div class="badge">
                <span class="dot"></span>
                Coming soon
            </div>
        </div>
    </body>
</html>
