<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🌸 Secret Garden</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
        }

        p {
            margin-top: 15px;
            opacity: 0;
            animation: fadeIn 3s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(100vh);
                opacity: 0;
            }

            to {
                transform: translateY(-10vh);
                opacity: 1;
            }
        }

        /* Flower */
        .flower {
            position: absolute;
            font-size: 2rem;
            animation: bloom 1s ease forwards;
        }

        @keyframes bloom {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Secret message */
        #message {
            margin-top: 20px;
            opacity: 0;
            transition: 1s;
        }

        .show {
            opacity: 1 !important;
        }
    </style>
</head>

<body>

    <h1>🌸 Welcome to the Secret Garden</h1>
    <p>Click anywhere to grow something beautiful...</p>

    <div id="message">✨ You found something not meant for everyone ✨</div>

    <script>

        // 🌟 Floating particles
        function createParticle() {
            const p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * window.innerWidth + "px";
            p.style.animationDuration = (5 + Math.random() * 5) + "s";
            document.body.appendChild(p);

            setTimeout(() => p.remove(), 10000);
        }

        setInterval(createParticle, 200);

        // 🌸 Click = flower bloom
        let clicks = 0;

        document.addEventListener("click", (e) => {
            const flower = document.createElement("div");
            flower.className = "flower";
            flower.innerText = ["🌸", "🌼", "🌷", "🪷", "🌻"][Math.floor(Math.random() * 5)];

            flower.style.left = e.clientX + "px";
            flower.style.top = e.clientY + "px";

            document.body.appendChild(flower);

            setTimeout(() => flower.remove(), 4000);

            clicks++;

            // ✨ Unlock secret message
            if (clicks === 7) {
                document.getElementById("message").classList.add("show");
            }
        });

        // 🔐 Optional access key
        const key = prompt("Enter the secret key:");

        if (key !== "tora123") {
            document.body.innerHTML = "<h1>Access Denied</h1>";
        }

    </script>

</body>

</html>
